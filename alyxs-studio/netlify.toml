[build]
  publish = "."
  # Netlify builds are switched off: the site is moving to GitHub Pages, and each
  # Netlify deploy uses free-plan credits. "exit 0" tells Netlify to skip every build.
  ignore = "exit 0"

# Uploaded pictures, audio and PDFs keep their file name, so they can be cached long.
[[headers]]
  for = "/assets/uploads/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Code and content change when you save in /admin, so browsers check for updates.
[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
