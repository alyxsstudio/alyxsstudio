# Alyx's Studio — editor settings (Sveltia CMS)
# The one line you may need to change: backend → repo  (your-github-name/repository-name)

backend:
  name: github
  repo: alyxsstudio/alyxsstudio
  branch: main
  commit_messages:
    update: Update {{collection}} “{{slug}}”
    uploadMedia: Upload “{{path}}”
    deleteMedia: Delete “{{path}}”
site_url: https://alyxsstudio.com
display_url: https://alyxsstudio.com
logo_url: /assets/img/smiley.png
media_folder: assets/uploads
public_folder: /assets/uploads
collections:
- name: studio
  label: Studio 网站设置
  icon: tune
  format: json
  files:
  - name: design
    label: Design 字体 · 颜色 · 排版
    file: data/design.json
    fields:
    - name: font_body
      label: 正文字体 Body font
      widget: select
      default: Geist
      options:
      - Geist
      - Instrument Sans
      - DM Sans
      - Work Sans
      - IBM Plex Sans
      - Manrope
      - Karla
      - Libre Franklin
      - Space Grotesk
      - Figtree
      - Outfit
      - Albert Sans
      - Newsreader
      - EB Garamond
      - Cormorant Garamond
      - Fraunces
      - Libre Caslon Text
      - Instrument Serif
      - Spectral
      - Gaegu
      - Patrick Hand
      - Caveat
      - Geist Mono
      - IBM Plex Mono
      - DM Mono
      - Space Mono
      - JetBrains Mono
      - Courier Prime
    - name: font_heading
      label: 标题字体 Heading font
      widget: select
      default: Same as body
      options:
      - Same as body
      - Geist
      - Instrument Sans
      - DM Sans
      - Work Sans
      - IBM Plex Sans
      - Manrope
      - Karla
      - Libre Franklin
      - Space Grotesk
      - Figtree
      - Outfit
      - Albert Sans
      - Newsreader
      - EB Garamond
      - Cormorant Garamond
      - Fraunces
      - Libre Caslon Text
      - Instrument Serif
      - Spectral
      - Gaegu
      - Patrick Hand
      - Caveat
      - Geist Mono
      - IBM Plex Mono
      - DM Mono
      - Space Mono
      - JetBrains Mono
      - Courier Prime
    - name: font_small
      label: 小字字体（日期、价格、栏目名）Small text font
      widget: select
      default: Geist Mono
      options:
      - Same as body
      - Geist Mono
      - IBM Plex Mono
      - DM Mono
      - Space Mono
      - JetBrains Mono
      - Courier Prime
      - Geist
      - Instrument Sans
      - DM Sans
      - Newsreader
      - EB Garamond
    - name: font_custom
      label: 自定义字体（可选）Custom Google Font
      widget: string
      required: false
      hint: 填 Google Fonts 上任意字体的名字（如 Noto Serif SC），会替换正文字体。不用就留空。
    - name: color_text
      label: 文字颜色 Text
      widget: color
      allowInput: true
      default: '#111111'
    - name: color_background
      label: 背景颜色 Background
      widget: color
      allowInput: true
      default: '#ffffff'
    - name: color_muted
      label: 灰色小字 Muted text
      widget: color
      allowInput: true
      default: '#8a8984'
    - name: color_line
      label: 分隔线 Lines
      widget: color
      allowInput: true
      default: '#e7e6e1'
    - name: color_tile
      label: 空图片底色 Empty picture
      widget: color
      allowInput: true
      default: '#f4f3ef'
    - name: color_highlight
      label: 选中高亮 Highlight
      widget: color
      allowInput: true
      default: '#f5e47c'
    - name: size_body
      label: 正文字号 Body size (px)
      widget: number
      value_type: int
      min: 12
      max: 22
      default: 15
    - name: size_heading
      label: 页面标题字号 Page title size (px)
      widget: number
      value_type: int
      min: 24
      max: 96
      default: 46
    - name: size_nav
      label: 导航字号 Menu size (px)
      widget: number
      value_type: int
      min: 11
      max: 20
      default: 13
    - name: uppercase_labels
      label: 栏目小标签用大写 Uppercase labels
      widget: boolean
      default: true
    - name: logo_home_width
      label: 首页 logo 宽度 (px)
      widget: number
      value_type: int
      min: 120
      max: 520
      default: 300
    - name: logo_header_width
      label: 左上角 logo 宽度 (px)
      widget: number
      value_type: int
      min: 36
      max: 140
      default: 64
    - name: page_width
      label: 页面最大宽度 Page width (px)
      widget: number
      value_type: int
      min: 860
      max: 1800
      default: 1240
    - name: image_corners
      label: 图片圆角 Picture corners (px)
      widget: number
      value_type: int
      min: 0
      max: 32
      default: 0
    - name: cols_shop
      label: 每行几个：Shop
      widget: number
      value_type: int
      min: 1
      max: 6
      default: 3
    - name: cols_objects
      label: 每行几个：Objects
      widget: number
      value_type: int
      min: 1
      max: 6
      default: 4
    - name: cols_art
      label: 每行几个：Art
      widget: number
      value_type: int
      min: 1
      max: 6
      default: 4
    - name: cols_wardrobe
      label: 每行几个：Wardrobe
      widget: number
      value_type: int
      min: 1
      max: 6
      default: 4
    - name: cols_books
      label: 每行几个：Books
      widget: number
      value_type: int
      min: 1
      max: 6
      default: 4
    - name: cols_picks
      label: 每行几个：Picks
      widget: number
      value_type: int
      min: 1
      max: 6
      default: 4
    - name: cols_video
      label: 每行几个：Vlog
      widget: number
      value_type: int
      min: 1
      max: 4
      default: 3
    - name: cols_mobile
      label: 手机上每行几个 On phones
      widget: number
      value_type: int
      min: 1
      max: 3
      default: 2
    - name: shape_shop
      label: 图片比例：Shop
      widget: select
      default: 4 / 5
      options:
      - label: 方形 1:1
        value: 1 / 1
      - label: 竖 4:5
        value: 4 / 5
      - label: 竖 3:4
        value: 3 / 4
      - label: 书封 2:3
        value: 2 / 3
      - label: 横 4:3
        value: 4 / 3
      - label: 宽 16:9
        value: 16 / 9
    - name: shape_objects
      label: 图片比例：Objects
      widget: select
      default: 4 / 5
      options:
      - label: 方形 1:1
        value: 1 / 1
      - label: 竖 4:5
        value: 4 / 5
      - label: 竖 3:4
        value: 3 / 4
      - label: 书封 2:3
        value: 2 / 3
      - label: 横 4:3
        value: 4 / 3
      - label: 宽 16:9
        value: 16 / 9
    - name: shape_art
      label: 图片比例：Art
      widget: select
      default: 4 / 5
      options:
      - label: 方形 1:1
        value: 1 / 1
      - label: 竖 4:5
        value: 4 / 5
      - label: 竖 3:4
        value: 3 / 4
      - label: 书封 2:3
        value: 2 / 3
      - label: 横 4:3
        value: 4 / 3
      - label: 宽 16:9
        value: 16 / 9
    - name: shape_wardrobe
      label: 图片比例：Wardrobe
      widget: select
      default: 3 / 4
      options:
      - label: 方形 1:1
        value: 1 / 1
      - label: 竖 4:5
        value: 4 / 5
      - label: 竖 3:4
        value: 3 / 4
      - label: 书封 2:3
        value: 2 / 3
      - label: 横 4:3
        value: 4 / 3
      - label: 宽 16:9
        value: 16 / 9
    - name: shape_books
      label: 图片比例：Books
      widget: select
      default: 2 / 3
      options:
      - label: 方形 1:1
        value: 1 / 1
      - label: 竖 4:5
        value: 4 / 5
      - label: 竖 3:4
        value: 3 / 4
      - label: 书封 2:3
        value: 2 / 3
      - label: 横 4:3
        value: 4 / 3
      - label: 宽 16:9
        value: 16 / 9
    - name: shape_picks
      label: 图片比例：Picks
      widget: select
      default: 1 / 1
      options:
      - label: 方形 1:1
        value: 1 / 1
      - label: 竖 4:5
        value: 4 / 5
      - label: 竖 3:4
        value: 3 / 4
      - label: 书封 2:3
        value: 2 / 3
      - label: 横 4:3
        value: 4 / 3
      - label: 宽 16:9
        value: 16 / 9
  - name: settings
    label: Studio 名称 · 联系 · 首页
    file: data/settings.json
    fields:
    - name: name
      label: 网站名 Name
      widget: string
    - name: tagline
      label: 首页一句话 Tagline
      widget: string
      required: false
    - name: email
      label: 邮箱 Email
      widget: string
      required: false
    - name: instagram_handle
      label: Instagram 账号（不带 @）
      widget: string
      required: false
    - name: instagram_url
      label: Instagram 链接
      widget: string
      required: false
    - name: logo_large
      label: 首页大 logo（留空用现在的）
      widget: image
      required: false
    - name: logo
      label: 左上角小 logo（留空用现在的）
      widget: image
      required: false
    - name: home_shop_count
      label: 首页显示几件商品
      widget: number
      value_type: int
      min: 0
      max: 8
      default: 4
    - name: instagram_tiles
      label: 首页 Instagram 方格
      label_singular: 方格
      widget: list
      required: false
      fields:
      - name: image
        label: 图片
        widget: image
        required: false
      - name: url
        label: 这条帖子的链接（可选）
        widget: string
        required: false
- name: sections
  label: Sections 栏目内容
  icon: dashboard
  format: json
  files:
  - name: writing
    label: Writing 文章
    file: data/writing.json
    fields:
    - name: title
      label: 栏目名（也显示在导航）
      widget: string
    - name: short
      label: 首页目录里的一句话
      widget: string
      required: false
    - name: intro
      label: 栏目简介
      widget: text
      required: false
    - name: items
      label: 文章
      label_singular: 文章
      widget: list
      summary: '{{fields.date}} · {{fields.title}}'
      fields:
      - name: date
        label: 日期
        widget: string
        required: false
        hint: 例如 2026-10
      - name: title
        label: 标题
        widget: string
      - name: note
        label: 一句简介
        widget: string
        required: false
      - name: image
        label: 配图（可选）
        widget: image
        required: false
      - name: body
        label: 正文（写在这里就在网站上直接阅读）
        widget: markdown
        required: false
      - name: url
        label: 外部链接（没有正文时，点标题跳到这里）
        widget: string
        required: false
  - name: research
    label: Research 学术研究
    file: data/research.json
    fields:
    - name: title
      label: 栏目名（也显示在导航）
      widget: string
    - name: short
      label: 首页目录里的一句话
      widget: string
      required: false
    - name: intro
      label: 栏目简介
      widget: text
      required: false
    - name: items
      label: 研究
      label_singular: 条目
      widget: list
      summary: '{{fields.date}} · {{fields.title}}'
      fields:
      - name: date
        label: 日期
        widget: string
        required: false
        hint: 例如 2026-10
      - name: title
        label: 标题
        widget: string
      - name: note
        label: 期刊 / 说明
        widget: string
        required: false
      - name: url
        label: 链接
        widget: string
        required: false
      - name: pdf
        label: PDF（可选）
        widget: file
        required: false
  - name: cv
    label: CV 简历
    file: data/cv.json
    fields:
    - name: title
      label: 栏目名（也显示在导航）
      widget: string
    - name: short
      label: 首页目录里的一句话
      widget: string
      required: false
    - name: intro
      label: 栏目简介
      widget: text
      required: false
    - name: pdf
      label: 简历 PDF（可选）
      widget: file
      required: false
    - name: sections
      label: 分组
      label_singular: 分组
      widget: list
      summary: '{{fields.heading}}'
      fields:
      - name: heading
        label: 分组名（如 Education）
        widget: string
      - name: rows
        label: 条目
        label_singular: 条目
        widget: list
        summary: '{{fields.date}} · {{fields.title}}'
        fields:
        - name: date
          label: 日期
          widget: string
          required: false
          hint: 例如 2026-10
        - name: title
          label: 内容
          widget: string
        - name: note
          label: 补充（学校、会议等）
          widget: string
          required: false
        - name: url
          label: 链接
          widget: string
          required: false
  - name: books
    label: Books 出版物（Kindle / Apple Books）
    file: data/books.json
    fields:
    - name: title
      label: 栏目名（也显示在导航）
      widget: string
    - name: short
      label: 首页目录里的一句话
      widget: string
      required: false
    - name: intro
      label: 栏目简介
      widget: text
      required: false
    - name: items
      label: 书
      label_singular: 书
      widget: list
      summary: '{{fields.title}}'
      fields:
      - name: title
        label: 书名
        widget: string
      - name: note
        label: 一句说明（类型、年份）
        widget: string
        required: false
      - name: image
        label: 封面
        widget: image
        required: false
      - name: links
        label: 购买 / 阅读链接
        label_singular: 链接
        widget: list
        required: false
        summary: '{{fields.label}}'
        fields:
        - name: label
          label: 按钮文字（如 Kindle、Apple Books、Amazon）
          widget: string
        - name: url
          label: 链接
          widget: string
          required: false
  - name: serial
    label: Serial 连载小说
    file: data/serial.json
    fields:
    - name: title
      label: 栏目名（也显示在导航）
      widget: string
    - name: short
      label: 首页目录里的一句话
      widget: string
      required: false
    - name: novel
      label: 小说名
      widget: string
    - name: intro
      label: 故事简介
      widget: text
      required: false
    - name: cover
      label: 封面（可选）
      widget: image
      required: false
    - name: read_on_label
      label: 外部平台按钮文字（可选）
      widget: string
      required: false
    - name: read_on_url
      label: 外部平台链接（可选）
      widget: string
      required: false
    - name: chapters
      label: 章节
      label_singular: 章节
      widget: list
      summary: Chapter {{fields.number}} · {{fields.title}}
      fields:
      - name: number
        label: 第几章
        widget: number
        value_type: int
        min: 0
      - name: title
        label: 章节名
        widget: string
      - name: date
        label: 日期
        widget: string
        required: false
        hint: 例如 2026-10
      - name: body
        label: 正文（写在这里就在网站上直接阅读）
        widget: markdown
        required: false
      - name: url
        label: 外部链接（没有正文时用）
        widget: string
        required: false
  - name: podcast
    label: Podcast 播客
    file: data/podcast.json
    fields:
    - name: title
      label: 栏目名（也显示在导航）
      widget: string
    - name: short
      label: 首页目录里的一句话
      widget: string
      required: false
    - name: show
      label: 节目名
      widget: string
    - name: intro
      label: 节目简介
      widget: text
      required: false
    - name: cover
      label: 节目封面（可选）
      widget: image
      required: false
    - name: listen
      label: 收听平台（Spotify、Apple Podcasts…）
      label_singular: 链接
      widget: list
      required: false
      summary: '{{fields.label}}'
      fields:
      - name: label
        label: 按钮文字（如 Kindle、Apple Books、Amazon）
        widget: string
      - name: url
        label: 链接
        widget: string
        required: false
    - name: episodes
      label: 单集
      label_singular: 单集
      widget: list
      summary: No. {{fields.number}} · {{fields.title}}
      fields:
      - name: number
        label: 第几期
        widget: number
        value_type: int
        min: 0
      - name: title
        label: 标题
        widget: string
      - name: date
        label: 日期
        widget: string
        required: false
        hint: 例如 2026-10
      - name: length
        label: 时长（如 24 min）
        widget: string
        required: false
      - name: note
        label: 一句简介
        widget: string
        required: false
      - name: audio
        label: 音频 mp3（网站上直接播放，建议 30MB 以内）
        widget: file
        required: false
      - name: url
        label: 外部收听链接（可选）
        widget: string
        required: false
  - name: video
    label: Vlog 视频
    file: data/video.json
    fields:
    - name: title
      label: 栏目名（也显示在导航）
      widget: string
    - name: short
      label: 首页目录里的一句话
      widget: string
      required: false
    - name: intro
      label: 栏目简介
      widget: text
      required: false
    - name: channel_label
      label: 频道按钮文字（如 YouTube）
      widget: string
      required: false
    - name: channel_url
      label: 频道链接
      widget: string
      required: false
    - name: items
      label: 视频
      label_singular: 视频
      widget: list
      summary: '{{fields.title}}'
      fields:
      - name: title
        label: 标题
        widget: string
      - name: note
        label: 一句说明（时长等）
        widget: string
        required: false
      - name: url
        label: YouTube 链接
        widget: string
        required: false
        hint: 填了 YouTube 链接，封面会自动显示
      - name: image
        label: 自定义封面（可选）
        widget: image
        required: false
  - name: objects
    label: Objects 设计商品
    file: data/objects.json
    fields:
    - name: title
      label: 栏目名（也显示在导航）
      widget: string
    - name: short
      label: 首页目录里的一句话
      widget: string
      required: false
    - name: intro
      label: 栏目简介
      widget: text
      required: false
    - name: items
      label: 作品
      label_singular: 作品
      widget: list
      summary: '{{fields.title}}'
      fields:
      - name: title
        label: 名字
        widget: string
      - name: note
        label: 一句说明
        widget: string
        required: false
      - name: image
        label: 图片
        widget: image
        required: false
      - name: in_shop
        label: 显示“In the shop”链接
        widget: boolean
        default: false
  - name: art
    label: Art 艺术作品
    file: data/art.json
    fields:
    - name: title
      label: 栏目名（也显示在导航）
      widget: string
    - name: short
      label: 首页目录里的一句话
      widget: string
      required: false
    - name: intro
      label: 栏目简介
      widget: text
      required: false
    - name: items
      label: 作品
      label_singular: 作品
      widget: list
      summary: '{{fields.title}}'
      fields:
      - name: title
        label: 名字
        widget: string
      - name: note
        label: 一句说明（材料、年份）
        widget: string
        required: false
      - name: image
        label: 图片
        widget: image
        required: false
  - name: wardrobe
    label: Wardrobe 个人穿搭
    file: data/wardrobe.json
    fields:
    - name: title
      label: 栏目名（也显示在导航）
      widget: string
    - name: short
      label: 首页目录里的一句话
      widget: string
      required: false
    - name: intro
      label: 栏目简介
      widget: text
      required: false
    - name: items
      label: 穿搭
      label_singular: 穿搭
      widget: list
      summary: '{{fields.title}}'
      fields:
      - name: title
        label: 名字
        widget: string
      - name: note
        label: 一句说明（材料、年份）
        widget: string
        required: false
      - name: image
        label: 图片
        widget: image
        required: false
  - name: picks
    label: Picks 亚马逊推荐
    file: data/picks.json
    fields:
    - name: title
      label: 栏目名（也显示在导航）
      widget: string
    - name: short
      label: 首页目录里的一句话
      widget: string
      required: false
    - name: intro
      label: 栏目简介
      widget: text
      required: false
    - name: disclosure
      label: 联盟声明（没加入 Amazon Associates 就清空）
      widget: string
      required: false
    - name: items
      label: 推荐
      label_singular: 推荐
      widget: list
      summary: '{{fields.title}}'
      fields:
      - name: title
        label: 名字
        widget: string
      - name: note
        label: 分类 / 一句话
        widget: string
        required: false
      - name: image
        label: 图片
        widget: image
        required: false
      - name: url
        label: 亚马逊链接
        widget: string
        required: false
  - name: shop
    label: Shop 商店
    file: data/shop.json
    fields:
    - name: title
      label: 栏目名（也显示在导航）
      widget: string
    - name: short
      label: 首页目录里的一句话
      widget: string
      required: false
    - name: intro
      label: 栏目简介
      widget: text
      required: false
    - name: items
      label: 商品
      label_singular: 商品
      widget: list
      summary: '{{fields.title}} · {{fields.price}}'
      fields:
      - name: title
        label: 商品名
        widget: string
      - name: price
        label: 价格（如 $38）
        widget: string
        required: false
      - name: status
        label: 状态
        widget: select
        default: available
        options:
        - label: 可购买 Available
          value: available
        - label: 即将上架 Coming soon
          value: soon
        - label: 售罄 Sold out
          value: sold out
      - name: note
        label: 一句说明（可选）
        widget: string
        required: false
      - name: image
        label: 图片
        widget: image
        required: false
      - name: url
        label: 付款链接（Stripe / Gumroad / Shopify）
        widget: string
        required: false
