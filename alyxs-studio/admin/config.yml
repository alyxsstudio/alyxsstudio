# Alyx's Studio — editor settings (Sveltia CMS)
# The website lives in the alyxs-studio/ folder of the repository, so every path starts with alyxs-studio/.
# Daily posts, Ongoing entries, Visual series and Design sketches are saved one file per entry in content/;
# the publish step (scripts/build.mjs) puts them in order for the website.

backend:
  name: github
  repo: alyxsstudio/alyxsstudio
  branch: main
  commit_messages:
    create: Add {{collection}} “{{slug}}”
    update: Update {{collection}} “{{slug}}”
    delete: Delete {{collection}} “{{slug}}”
    uploadMedia: Upload “{{path}}”
    deleteMedia: Delete “{{path}}”
site_url: https://alyxsstudio.com
display_url: https://alyxsstudio.com
logo_url: /assets/img/smiley.png
media_folder: alyxs-studio/assets/uploads
public_folder: /assets/uploads
media_libraries:
  default:
    config:
      max_file_size: 31457280
      slugify_filename: true
      transformations:
        raster_image:
          format: webp
          quality: 86
          width: 2880
          height: 2880
collections:
- name: daily
  label: Daily 日常
  label_singular: 日常
  icon: calendar_month
  folder: alyxs-studio/content/daily
  create: true
  format: json
  extension: json
  slug: '{{year}}-{{month}}-{{day}}-{{hour}}{{minute}}{{second}}'
  summary: '{{fields.date}}  {{fields.text}}'
  sortable_fields:
    fields:
    - date
    default:
      field: date
      direction: descending
  view_groups:
  - label: 月份
    field: date
    pattern: \d{4}-\d{2}
  description: 碎碎念、感悟、图片、语音、转载、截图。按日期出现在网站的日历上。
  fields:
  - name: date
    label: 时间
    widget: datetime
    default: '{{now}}'
    format: YYYY-MM-DDTHH:mm
    picker_utc: false
  - name: text
    label: 文字
    widget: markdown
    required: false
  - name: images
    label: 图片（可以一次选多张）
    widget: image
    required: false
    multiple: true
  - name: audio
    label: 语音 / 音频（可选）
    widget: file
    required: false
    accept: audio/*
  - name: link
    label: 转载 / 链接（可选）
    widget: object
    required: false
    collapsed: true
    fields:
    - name: url
      label: 链接
      widget: string
      required: false
    - name: title
      label: 来源名称（如 Threads）
      widget: string
      required: false
    - name: quote
      label: 摘一句话（可选）
      widget: text
      required: false
  - name: tags
    label: 标签（可选）
    widget: list
    required: false
  - name: hidden
    label: 先不公开（草稿）
    widget: boolean
    default: false
- name: entries
  label: Ongoing 每日更新
  label_singular: 条目
  icon: auto_stories
  folder: alyxs-studio/content/entries
  create: true
  format: json
  extension: json
  slug: '{{fields.project}}-{{year}}{{month}}{{day}}-{{hour}}{{minute}}{{second}}'
  summary: '{{fields.project}} · {{fields.title}}'
  sortable_fields:
    fields:
    - date
    - title
    - project
    default:
      field: date
      direction: descending
  view_groups:
  - label: 合集
    field: project
  description: 往某个合集里加一条：小说的一章、词典的一个词、一张连载图片。网站会按合集的排序方式自动排好。
  fields:
  - name: project
    label: 属于哪个合集
    widget: relation
    collection: projects
    value_field: '{{slug}}'
    search_fields:
    - title
    display_fields:
    - title
  - name: date
    label: 时间
    widget: datetime
    default: '{{now}}'
    format: YYYY-MM-DDTHH:mm
    picker_utc: false
  - name: title
    label: 标题（章节名、词语……）
    widget: string
    required: false
  - name: number
    label: 编号（按编号排序时用，可留空）
    widget: number
    value_type: int
    required: false
  - name: images
    label: 图片（可多张）
    widget: image
    required: false
    multiple: true
  - name: text
    label: 文字
    widget: markdown
    required: false
  - name: audio
    label: 音频（可选）
    widget: file
    required: false
    accept: audio/*
- name: projects
  label: Ongoing 合集设置
  label_singular: 合集
  icon: collections_bookmark
  folder: alyxs-studio/content/projects
  create: true
  format: json
  extension: json
  identifier_field: title
  slug: '{{slug}}'
  summary: '{{fields.title}}'
  description: 每个合集是一个正在进行的项目：连载小说、图片词典、图片连载……
  fields:
  - name: title
    label: 合集名称
    widget: string
  - name: note
    label: 一句介绍
    widget: text
    required: false
  - name: kind
    label: 内容类型
    widget: select
    options:
    - label: 文字为主（小说、文章）
      value: text
    - label: 图片为主（词典、图片连载）
      value: image
    - label: 图文混合
      value: mixed
    default: mixed
  - name: sort
    label: 自动排序
    widget: select
    options:
    - label: 按日期，最早的在前
      value: date-asc
    - label: 按日期，最新的在前
      value: date-desc
    - label: 按标题 A–Z
      value: title
    - label: 按编号
      value: number
    default: date-asc
  - name: cover
    label: 封面（可选，不填就用第一张图）
    widget: image
    required: false
  - name: status
    label: 状态
    widget: select
    options:
    - label: 进行中
      value: ongoing
    - label: 已完成
      value: finished
    default: ongoing
  - name: download
    label: 谁可以下载打包
    widget: select
    options:
    - label: 只有我
      value: private
    - label: 所有访客
      value: public
    default: private
  - name: date
    label: 开始日期
    widget: datetime
    time_format: false
    default: '{{now}}'
    format: YYYY-MM-DD
    picker_utc: false
  - name: hidden
    label: 先不公开
    widget: boolean
    default: false
- name: visual
  label: Visual 图片系列
  label_singular: 系列
  icon: photo_library
  folder: alyxs-studio/content/visual
  create: true
  format: json
  extension: json
  identifier_field: title
  slug: '{{slug}}'
  summary: '{{fields.title}}'
  description: 壁纸、头像、封面……每个系列一组图片。
  fields:
  - name: title
    label: 系列名称
    widget: string
  - name: kind
    label: 类型
    widget: select
    options:
    - Wallpaper
    - Avatar
    - Cover
    - Drawing
    - Other
    default: Wallpaper
  - name: date
    label: 日期
    widget: datetime
    time_format: false
    default: '{{now}}'
    format: YYYY-MM-DD
    picker_utc: false
  - name: note
    label: 一句介绍
    widget: text
    required: false
  - name: download
    label: 谁可以下载
    widget: select
    options:
    - label: 所有访客
      value: public
    - label: 只有我
      value: private
    default: public
  - name: images
    label: 图片
    label_singular: 图片
    widget: list
    fields:
    - name: image
      label: 图片
      widget: image
      required: false
    - name: title
      label: 名字（可选）
      widget: string
      required: false
    - name: phone
      label: 手机版（可选）
      widget: image
      required: false
    - name: desktop
      label: 电脑版（可选）
      widget: image
      required: false
    required: false
    summary: '{{fields.title}}'
  - name: hidden
    label: 先不公开
    widget: boolean
    default: false
- name: design
  label: Design 草图·构思
  label_singular: 草图
  icon: draw
  folder: alyxs-studio/content/design
  create: true
  format: json
  extension: json
  identifier_field: title
  slug: '{{slug}}'
  summary: '{{fields.title}}'
  sortable_fields:
    fields:
    - date
    - title
    default:
      field: date
      direction: descending
  fields:
  - name: title
    label: 名字
    widget: string
  - name: date
    label: 日期
    widget: datetime
    time_format: false
    default: '{{now}}'
    format: YYYY-MM-DD
    picker_utc: false
  - name: images
    label: 草图、构思图（可多张）
    widget: image
    required: false
    multiple: true
  - name: note
    label: 一句说明
    widget: text
    required: false
  - name: link
    label: 相关链接（比如成品的购买页，可选）
    widget: string
    required: false
  - name: hidden
    label: 先不公开
    widget: boolean
    default: false
- name: media
  label: Watch · Listen 视频和音乐
  label_singular: 视频 / 音乐
  icon: play_circle
  folder: alyxs-studio/content/media
  create: true
  format: json
  extension: json
  identifier_field: title
  slug: '{{year}}{{month}}{{day}}-{{hour}}{{minute}}{{second}}'
  summary: '{{fields.title}} {{fields.url}}'
  sortable_fields:
    fields:
    - date
    - title
    default:
      field: date
      direction: descending
  fields:
  - name: url
    label: 链接（YouTube、TikTok、Instagram、B站、抖音、Spotify、Apple Music、Apple Podcasts、SoundCloud、Bandcamp、网易云……）
    widget: string
    required: false
    hint: 粘贴作品页面的链接就行，网站会显示成播放器；标题和封面在发布时自动获取。
  - name: file
    label: 或者上传文件（自己的歌、录音、短视频，95MB 以内）
    widget: file
    required: false
  - name: title
    label: 标题（链接可以留空，自动用平台上的标题）
    widget: string
    required: false
  - name: note
    label: 一句话（可选）
    widget: text
    required: false
  - name: cover
    label: 封面（可选，链接会自动获取）
    widget: image
    required: false
  - name: date
    label: 时间
    widget: datetime
    default: '{{now}}'
    format: YYYY-MM-DDTHH:mm
    picker_utc: false
  - name: shelf
    label: 放在哪个栏目
    widget: select
    options:
    - label: 自动（视频→Watch，音乐和播客→Listen）
      value: auto
    - label: Watch
      value: watch
    - label: Listen
      value: listen
    default: auto
  - name: category
    label: 类型（Listen 里的分类）
    widget: select
    options:
    - label: 自动
      value: auto
    - label: Music 音乐
      value: Music
    - label: Podcasts 播客
      value: Podcasts
    - label: Video 视频
      value: Video
    default: auto
  - name: hidden
    label: 先不公开
    widget: boolean
    default: false
- name: pages
  label: Books · Store · Traces
  icon: view_list
  format: json
  files:
  - name: books
    label: Books 出版的书
    file: alyxs-studio/data/books.json
    fields:
    - name: items
      label: 书
      label_singular: 书
      widget: list
      fields:
      - name: title
        label: 书名
        widget: string
      - name: category
        label: 分类（Writing、Language、Art……可以自己写新的）
        widget: string
        default: Writing
      - name: note
        label: 一句说明
        widget: string
        required: false
      - name: image
        label: 封面
        widget: image
        required: false
      - name: links
        label: 购买 / 阅读链接
        label_singular: 链接
        widget: list
        fields:
        - name: label
          label: 按钮文字（Amazon、Kindle、Apple Books…）
          widget: string
        - name: url
          label: 链接
          widget: string
          required: false
        required: false
        summary: '{{fields.label}}'
      summary: '{{fields.category}} · {{fields.title}}'
  - name: store
    label: Store 物件
    file: alyxs-studio/data/store.json
    fields:
    - name: items
      label: 物件
      label_singular: 物件
      widget: list
      fields:
      - name: title
        label: 名字
        widget: string
      - name: category
        label: 分类（Clothing、Hats、Bags、Charms……可以自己写新的）
        widget: string
        default: Other
      - name: price
        label: 价格（可留空）
        widget: string
        required: false
      - name: status
        label: 状态
        widget: select
        options:
        - label: 可购买
          value: available
        - label: 即将上架
          value: soon
        - label: 售罄
          value: sold out
        default: available
      - name: note
        label: 一句说明
        widget: string
        required: false
      - name: image
        label: 图片
        widget: image
        required: false
      - name: url
        label: 购买链接
        widget: string
        required: false
      summary: '{{fields.category}} · {{fields.title}}'
  - name: traces
    label: Traces 作品足迹
    file: alyxs-studio/data/traces.json
    fields:
    - name: note
      label: 开头一段话（可选）
      widget: markdown
      required: false
    - name: items
      label: 足迹
      label_singular: 条
      widget: list
      fields:
      - name: kind
        label: 类型
        widget: select
        options:
        - label: Published 发表
          value: Published
        - label: Shown 展出
          value: Shown
        - label: Talks 对谈·讲座
          value: Talks
        - label: Collaborations 合作
          value: Collaborations
        - label: Memberships 协会
          value: Memberships
        - label: Mentions 提及·报道
          value: Mentions
        default: Published
      - name: year
        label: 年份
        widget: string
        required: false
      - name: title
        label: 作品 / 事件
        widget: string
      - name: where
        label: 在哪里（刊物、展览、平台…）
        widget: string
        required: false
      - name: url
        label: 链接（可选）
        widget: string
        required: false
      required: false
      summary: '{{fields.year}} · {{fields.kind}} · {{fields.title}}'
- name: site
  label: Site 网站设置
  icon: tune
  format: json
  files:
  - name: sections
    label: 栏目名称和菜单
    file: alyxs-studio/data/sections.json
    fields:
    - name: sections
      label: 栏目（拖动调整菜单顺序）
      label_singular: 栏目
      widget: list
      fields:
      - name: key
        label: 哪个栏目
        widget: select
        options:
        - label: Daily 日常
          value: daily
        - label: Ongoing 进行中的合集
          value: ongoing
        - label: Watch 视频
          value: watch
        - label: Listen 音乐和播客
          value: listen
        - label: Books 出版的书
          value: books
        - label: Visual 壁纸·头像·封面
          value: visual
        - label: Design 草图·构思
          value: design
        - label: Store 物件和链接
          value: store
        - label: Traces 作品足迹
          value: traces
        - label: Follow 所有平台
          value: follow
        default: daily
      - name: title
        label: 显示的名字（菜单、标题都用它）
        widget: string
      - name: short
        label: 一句话（首页目录用）
        widget: string
        required: false
      - name: intro
        label: 页面顶部的介绍（可选）
        widget: text
        required: false
      - name: in_menu
        label: 显示在菜单里
        widget: boolean
        default: true
      summary: '{{fields.title}}'
      hint: 改名字只在这里改，菜单、首页和页面标题会一起变。
  - name: settings
    label: 首页 · 联系方式
    file: alyxs-studio/data/settings.json
    fields:
    - name: name
      label: 网站名
      widget: string
    - name: tagline
      label: 首页一句话
      widget: string
      required: false
    - name: email
      label: 邮箱
      widget: string
      required: false
    - name: media_autoplay
      label: 视频滑到屏幕中间时自动静音播放
      widget: boolean
      default: true
    - name: language_switch
      label: 让访客也能切换 English / 中文
      widget: boolean
      default: false
    - name: announcement
      label: 顶部通知条（不用就留空）
      widget: object
      required: false
      fields:
      - name: text
        label: 文字
        widget: string
        required: false
      - name: url
        label: 链接
        widget: string
        required: false
    - name: logo_large
      label: 首页大 logo（留空用现在的）
      widget: image
      required: false
    - name: logo
      label: 左上角小 logo（留空用现在的）
      widget: image
      required: false
    - name: home_blocks
      label: 首页模块（从上到下的顺序）
      label_singular: 模块
      widget: list
      hint: 拖动或用箭头调整顺序；点“添加”选择新模块。
      types:
      - name: hero
        label: Logo + 一句话
        widget: object
        fields:
        - name: show_logo
          label: 显示大 logo
          widget: boolean
          default: true
        - name: show_tagline
          label: 显示一句话
          widget: boolean
          default: true
      - name: daily
        label: 最新日常
        widget: object
        fields:
        - name: title
          label: 小标题（留空就用栏目名）
          widget: string
          required: false
        - name: count
          label: 显示几个
          widget: number
          value_type: int
          min: 1
          max: 24
          default: 6
      - name: ongoing
        label: 进行中的合集
        widget: object
        fields:
        - name: title
          label: 小标题（留空就用栏目名）
          widget: string
          required: false
        - name: count
          label: 显示几个
          widget: number
          value_type: int
          min: 1
          max: 24
          default: 3
      - name: visual
        label: Visual 图片
        widget: object
        fields:
        - name: title
          label: 小标题（留空就用栏目名）
          widget: string
          required: false
        - name: count
          label: 显示几个
          widget: number
          value_type: int
          min: 1
          max: 24
          default: 4
      - name: design
        label: Design 草图
        widget: object
        fields:
        - name: title
          label: 小标题（留空就用栏目名）
          widget: string
          required: false
        - name: count
          label: 显示几个
          widget: number
          value_type: int
          min: 1
          max: 24
          default: 3
      - name: store
        label: Store 物件
        widget: object
        fields:
        - name: title
          label: 小标题（留空就用栏目名）
          widget: string
          required: false
        - name: count
          label: 显示几个
          widget: number
          value_type: int
          min: 1
          max: 24
          default: 4
      - name: books
        label: Books 出版
        widget: object
        fields:
        - name: title
          label: 小标题（留空就用栏目名）
          widget: string
          required: false
        - name: count
          label: 显示几个
          widget: number
          value_type: int
          min: 1
          max: 24
          default: 4
      - name: watch
        label: Watch 视频
        widget: object
        fields:
        - name: title
          label: 小标题（留空就用栏目名）
          widget: string
          required: false
        - name: count
          label: 显示几个
          widget: number
          value_type: int
          min: 1
          max: 24
          default: 3
      - name: listen
        label: Listen 音乐和播客
        widget: object
        fields:
        - name: title
          label: 小标题（留空就用栏目名）
          widget: string
          required: false
        - name: count
          label: 显示几个
          widget: number
          value_type: int
          min: 1
          max: 24
          default: 4
      - name: follow
        label: 所有平台链接
        widget: object
        fields:
        - name: title
          label: 小标题（留空就用栏目名）
          widget: string
          required: false
      - name: index
        label: 栏目目录
        widget: object
        fields:
        - name: title
          label: 小标题（留空就用栏目名）
          widget: string
          required: false
      - name: text
        label: 一段文字
        widget: object
        fields:
        - name: title
          label: 标题（可留空）
          widget: string
          required: false
        - name: body
          label: 内容
          widget: markdown
          required: false
        - name: align
          label: 对齐
          widget: select
          options:
          - label: 靠左
            value: left
          - label: 居中
            value: center
          default: left
      - name: image
        label: 一张大图
        widget: object
        fields:
        - name: image
          label: 图片
          widget: image
          required: false
        - name: caption
          label: 说明（可留空）
          widget: string
          required: false
        - name: url
          label: 点击跳转（可留空）
          widget: string
          required: false
        - name: size
          label: 宽度
          widget: select
          options:
          - label: 满宽
            value: full
          - label: 较宽
            value: wide
          - label: 窄
            value: narrow
          default: wide
      - name: spacer
        label: 空白间隔
        widget: object
        fields:
        - name: size
          label: 大小
          widget: select
          options:
          - label: 小
            value: small
          - label: 中
            value: medium
          - label: 大
            value: large
          default: medium
  - name: follow
    label: Follow 所有平台
    file: alyxs-studio/data/follow.json
    fields:
    - name: groups
      label: 分组
      label_singular: 分组
      widget: list
      fields:
      - name: name
        label: 分组名（Social、Watch、Listen、Read…）
        widget: string
      - name: links
        label: 平台
        label_singular: 平台
        widget: list
        fields:
        - name: label
          label: 平台名
          widget: string
        - name: url
          label: 链接（留空就不显示）
          widget: string
          required: false
        - name: handle
          label: 账号名（可选）
          widget: string
          required: false
        summary: '{{fields.label}}'
      summary: '{{fields.name}}'
      hint: 填了链接的平台才会显示，同时出现在每页底部。
