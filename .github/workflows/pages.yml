# Publishes alyxsstudio.com with GitHub Pages.
# Runs every time something is saved (in /admin or on the site itself — each save is a commit to main).
name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # to keep data/translations.json up to date
  pages: write
  id-token: write

# If you save several times in a row, only the newest version is published.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: English versions of Chinese text
        run: node alyxs-studio/scripts/translate.mjs alyxs-studio
        env:
          # add one of these in Settings → Secrets and variables → Actions for better English;
          # with none, a free translator without a key is used
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
        continue-on-error: true
      - name: Build
        run: node alyxs-studio/scripts/build.mjs alyxs-studio _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Keep the translations
        continue-on-error: true
        run: |
          if [ -n "$(git status --porcelain -- alyxs-studio/data/translations.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add alyxs-studio/data/translations.json
            git commit -m "Update English translations [skip ci]"
            git pull --rebase origin main && git push origin HEAD:main
          fi

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
